
<!DOCTYPE html>
<html lang="en" data-theme="light" data-font="serif">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rails + Grid — lewk template</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Inter:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&family=VT323&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../lewk.css">
</head>
<body>

<nav class="nav flush">
  <a class="brand" href="../"></a>
  <a href="#"></a>
  <a href="#"></a>
  <a href="#"></a>
</nav>
<nav class="breadcrumb bare" aria-label="Breadcrumb">
  <a href="#"></a>
  <span aria-current="page"></span>
</nav>
<main class="wide">

<section class="section">
  <div class="row">
    <div class="label"></div>
    <div>
      <h2 style="margin: 0 0 var(--sp-2)"></h2>
      <p class="muted"></p>
    </div>
  </div>
</section>

<!-- Rails: equal-column layout with vertical hairlines -->
<section class="section">
  <h6></h6>
  <div class="rails rails-3" style="margin-top: var(--sp-3); border-top: var(--rule); padding-top: var(--sp-4)">
    <div>
      <div class="meta"></div>
      <h3 style="margin: var(--sp-2) 0 var(--sp-3)"></h3>
      <p></p>
      <a class="link-arrow" href="#"></a>
    </div>
  </div>
</section>

<!-- Grid: auto-fill card index -->
<section class="section">
  <h6></h6>
  <div class="grid" style="margin-top: var(--sp-3)">
    <a class="card" href="#">
      <div class="card-thumb"></div>
      <div class="card-title"></div>
      <div class="card-meta"></div>
    </a>

  </div>
</section>
</main>
<footer class="footer">
  <span></span>
  <a href="../" class="meta">← Reference</a>
</footer>

</body>
</html>
